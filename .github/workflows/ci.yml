name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.11.1"
      - name: MCP launcher regression tests
        run: node --test tests/test_mcp_launcher.mjs
      - name: Validate project
        run: python scripts/validate_project.py
      - name: Install Lua test runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Regression tests
        env:
          WAE_LUA: ${{ runner.os == 'Linux' && 'lua5.1' || '' }}
        run: python -m unittest discover -s tests -v
      - name: Windows wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WAE_PYTHON = (Get-Command python).Source
          ./scripts/doctor.ps1 --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build host packages
        run: |
          python scripts/package_plugin.py --host codex
          python scripts/package_plugin.py --host claude
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugins-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
